<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purelymail Long Poll API Tester</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .card { border: 1px solid #ccc; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, textarea, button { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #0056b3; }
        button.stop { background-color: #dc3545; }
        button.stop:hover { background-color: #bd2130; }
        #log { background: #1e1e1e; color: #00ff00; padding: 15px; border-radius: 6px; height: 250px; overflow-y: auto; font-family: monospace; white-space: pre-wrap; }
        .status { font-weight: bold; color: #666; }
    </style>
</head>
<body>

    <h2>Purelymail Long Poll API Tester</h2>

    <div class="card">
        <h3>1. Listen for Incoming Email (Long Poll)</h3>
        <label for="streamAlias">Alias to Monitor:</label>
        <input type="text" id="streamAlias" value="user123" placeholder="e.g. user123">

        <button id="btnStartPoll" onclick="startPoll()">Start Listening (Long Poll)</button>
        <button id="btnStopPoll" class="stop" onclick="stopPoll()" disabled>Stop Listening</button>
        <p class="status">Status: <span id="pollStatus">Idle</span></p>
    </div>

    <div class="card">
        <h3>2. Send Email (POST)</h3>
        <label for="sendAlias">Alias:</label>
        <input type="text" id="sendAlias" value="user123">

        <label for="sendBody">Body (#EMAILNAME will be replaced):</label>
        <textarea id="sendBody" rows="3">Hello #EMAILNAME, requesting mobile app access for user123.</textarea>

        <button onclick="sendEmail()">Send Email</button>
    </div>

    <h3>Event Console Log</h3>
    <div id="log">System ready...\n</div>

    <script>
        const API_BASE = "https://southbag-mail-forwarding-application-for_mobile_v1_application.sometgirl.online";
        let pollAbort = null;
        let pollActive = false;

        function log(message) {
            const logDiv = document.getElementById("log");
            const timestamp = new Date().toLocaleTimeString();
            logDiv.textContent += `[${timestamp}] ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Start Long Polling
        async function startPoll() {
            const alias = document.getElementById("streamAlias").value.trim();
            if (!alias) {
                alert("Please enter an alias.");
                return;
            }

            if (pollActive) {
                stopPoll();
            }

            pollActive = true;
            document.getElementById("pollStatus").textContent = "Polling...";
            document.getElementById("btnStartPoll").disabled = true;
            document.getElementById("btnStopPoll").disabled = false;

            log(`Starting long poll for alias "${alias}"...`);

            while (pollActive) {
                pollAbort = new AbortController();
                try {
                    const url = `${API_BASE}/`;
                    log(`POST ${url} { action: "poll", alias: "${alias}" }`);

                    const response = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ action: "poll", alias: alias }),
                        signal: pollAbort.signal
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    log("Poll response:");
                    log(JSON.stringify(data, null, 2));

                    if (data?.status === "success" && data?.data?.messageFound) {
                        log("Message received — stopping poll.");
                        stopPoll();
                        return;
                    }

                    if (data?.status === "error") {
                        log("Poll errored — stopping poll.");
                        stopPoll();
                        return;
                    }
                } catch (err) {
                    if (err.name === "AbortError") {
                        log("Poll aborted by user.");
                        return;
                    }
                    log("Poll error: " + err.message);
                    // Brief backoff before reconnecting
                    await new Promise(r => setTimeout(r, 1000));
                }
            }
        }

        // Stop Long Polling
        function stopPoll() {
            pollActive = false;
            if (pollAbort) {
                pollAbort.abort();
                pollAbort = null;
            }
            document.getElementById("pollStatus").textContent = "Idle";
            document.getElementById("btnStartPoll").disabled = false;
            document.getElementById("btnStopPoll").disabled = true;
            log("Polling stopped.");
        }

        // Trigger POST Send Email Action
        async function sendEmail() {
            const alias = document.getElementById("sendAlias").value.trim();
            const body = document.getElementById("sendBody").value;

            if (!alias || !body) {
                alert("Alias and Body are required.");
                return;
            }

            log(`Sending POST request to ${API_BASE}/...`);

            try {
                const response = await fetch(`${API_BASE}/`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action: "send", alias: alias, body: body })
                });

                const data = await response.json();
                log("POST Response: " + JSON.stringify(data));
            } catch (err) {
                log("POST Error: " + err.message);
            }
        }
    </script>
</body>
</html>
