name: Build Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Cordova
        run: npm install -g cordova

      - name: Install dependencies
        run: npm ci

      # config.xml points the Android app at the GitHub Pages copy of the UI, so
      # the APK only ships a one-line page that sends the WebView there.
      - name: Replace bundled UI with GitHub Pages loader
        run: |
          rm -rf www
          mkdir www
          echo '<!DOCTYPE html><meta charset="utf-8"><script>location.replace("https://southbaghq.github.io/mobile-v1/")</script>' > www/index.html

      - name: Add Android platform
        run: cordova platform add android

      - name: Build Android APK
        run: cordova build android --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: platforms/android/app/build/outputs/apk/release/*.apk
